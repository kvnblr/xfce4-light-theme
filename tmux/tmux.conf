unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set -s set-clipboard on
set -g mouse on

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Status Bar Layout & Timing
set -g status-position top
set -g status-justify left
set -g status-interval 60

# Status Bar Styling (One Light Theme)
set -g status-style "bg=#f0f0f1,fg=#383a42"

set -g status-left-length 50
set -g status-left "#[fg=#4078f2,bg=#f0f0f1,bold]    #S #[fg=#a0a1a7]│ "

set -g status-right-length 120
set -g status-right "#[fg=#986801]#(curl -s 'wttr.in/?format=%%c+%%t') #[fg=#a0a1a7]│ #[fg=#e45649] %Y-%m-%d #[fg=#a0a1a7]│ #[fg=#0184bc] %H:%M "

set -g window-status-format "#[fg=#696c77] #I:#W "
set -g window-status-current-format "#[fg=#f0f0f1,bg=#4078f2,bold] #I:#W #[default]"

set -g pane-border-style "fg=#e5e5e6"
set -g pane-active-border-style "fg=#4078f2"
